<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YardBook — Book lawn care</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1b1b1b; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; font-size: 16px; background: #1d6b34; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    button.secondary { background: #5a5a5a; }
    [role="alert"] { color: #a40000; margin-top: 12px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Book lawn care</h1>
    <form id="booking-form" novalidate>
      <label for="address">Service address</label>
      <input id="address" name="address" autocomplete="street-address" required>

      <label for="service">Service</label>
      <select id="service" name="serviceId" required></select>

      <label for="date">Date</label>
      <input id="date" name="date" type="date" required>

      <button type="submit">Book now</button>
    </form>
    <div id="errors" role="alert" aria-live="assertive"></div>
    <section id="confirmation" aria-live="polite"></section>
  </main>
  <script>
    const form = document.getElementById('booking-form');
    const errorsEl = document.getElementById('errors');
    const confirmation = document.getElementById('confirmation');

    fetch('/api/services').then((r) => r.json()).then((services) => {
      document.getElementById('service').innerHTML = services
        .map((s) => `<option value="${s.id}">${s.name} — $${s.priceUsd}</option>`).join('');
    });

    function renderBooking(b) {
      confirmation.innerHTML = `
        <div class="card" data-testid="booking-card">
          <h2>Booking ${b.status}</h2>
          <p>${b.serviceName} at ${b.address} on ${b.date} — $${b.priceUsd}</p>
          ${b.status === 'confirmed' ? '<button type="button" class="secondary" id="cancel">Cancel booking</button>' : ''}
        </div>`;
      const cancel = document.getElementById('cancel');
      if (cancel) cancel.addEventListener('click', async () => {
        const res = await fetch(`/api/bookings/${b.id}/cancel`, { method: 'POST' });
        renderBooking(await res.json());
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorsEl.textContent = '';
      confirmation.innerHTML = '';
      const body = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/bookings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) { errorsEl.textContent = data.errors.join('. '); return; }
      renderBooking(data);
    });
  </script>
</body>
</html>
